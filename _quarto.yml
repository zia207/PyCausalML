project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - Tutorials/00-scientific-terminology-glossary.qmd
    - Tutorials/02_08_05_00_casual_ml_introduction.ipynb
    - Tutorials/05_01_Tree_Based_Models/*.ipynb
    - Tutorials/05_02_Meta_Learners/*.ipynb
    - Tutorials/05_03_Uplift_Learners/*.ipynb
    - Tutorials/05_04_DoubleML/*.ipynb
    - Tutorials/05_05_DeepCausalML/*.ipynb
    - Tutorials/05_06_Bayesian_CausalML/*.ipynb
    - Tutorials/05_07_Policy_Learners/*.ipynb
    - Tutorials/05_08_Quasi_Experiements/*.ipynb

website:
  title: "PyCausalML"
  description: "Classical and deep causal inference in one Python package"
  site-url: https://zia207.github.io/PyCausalML/
  repo-url: https://github.com/zia207/PyCausalML
  repo-branch: main
  repo-actions: [edit, issue, source]
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: sidebar
    type: textbox
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-By Zia Ahmed, Upatta Analytics, 2026"
  navbar:
    background: primary
    logo: logo_PyCausalML.png
    logo-alt: "PyCausalML"
    logo-href: index.qmd
    left:
      - text: Home
        href: index.qmd
      - text: Tutorial
        href: Tutorials/02_08_05_00_casual_ml_introduction.ipynb
      - text: Glossary
        href: Tutorials/00-scientific-terminology-glossary.qmd
      - icon: house
        href: https://sites.google.com/view/r-data-sci-env/home
        aria-label: Upatta Analytics
    right:
      - icon: github
        href: https://github.com/zia207/PyCausalML
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/zia-ahmed207
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:zia207@gmail.com
        aria-label: Email

