[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycausalml"
version = "0.2.0"
description = "Classical and deep causal inference: trees, uplift, meta-learners, double ML, policies, Bayesian quasi-experiments and networks, and PyDeepCausalML"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zia U. Ahmed", email = "zia207@gmail.com" },
]
keywords = [
    "causal-inference",
    "causal-discovery",
    "uplift-modeling",
    "double-machine-learning",
    "deep-learning",
    "pytorch",
    "treatment-effects",
    "counterfactual",
    "time-series",
    "bayesian-inference",
    "quasi-experiments",
    "causal-networks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "networkx>=3.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
boost = ["xgboost>=1.7"]
shap = ["shap>=0.44"]
dowhy = ["dowhy>=0.11"]
econml = ["econml>=0.15"]
causallearn = ["causal-learn>=0.1.3.8"]
uber = ["causalml>=0.15"]
doubleml = ["doubleml>=0.7"]
causalpy = ["CausalPy>=0.4"]
skgrf = ["skgrf>=0.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://zia207.github.io/PyCausalML/"
Documentation = "https://zia207.github.io/PyCausalML/"
Repository = "https://github.com/zia207/PyCausalML"
DeepModels = "https://github.com/zia207/PyDeepCausalML"
Issues = "https://github.com/zia207/PyCausalML/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
